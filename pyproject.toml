[build-system]
# 77 is the first release that accepts `license` below as an SPDX string; older
# ones reject this file outright, which an isolated build (always the latest
# setuptools) never shows.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisurg-4d-scene-graph"
version = "0.1.0"
description = "Training-free 4D scene graphs for minimally invasive surgery, and the toolkit they are measured with"
readme = "README.md"
# The lowest version CI runs. Declaring an older one would promise installs
# nothing checks.
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Yasuto Tamura" }]

# What the evaluator needs: it reads masks with Pillow, and takes regions and
# boundaries with numpy and OpenCV. Their versions are recorded with every
# score, so they are deliberately unpinned here: a reader should be able to
# install this next to whatever else they have, and pinning would make the
# package uninstallable long before the numbers stop being citable.
# opencv-python rather than opencv-python-headless, though nothing here opens a
# window: both install the same `cv2` package, so depending on the headless one
# would leave two builds writing over each other in an environment that already
# has opencv-python.
dependencies = ["numpy", "opencv-python", "Pillow"]

[project.optional-dependencies]
# What the pipeline's images and point clouds need and the evaluator does
# not: the depth colormaps (matplotlib) and the GLB writer (trimesh),
# imported by `surgical_core.geometry.render`, `surgical_core.viewer.depth_vis`
# and `surgical_core.viewer.glb`. Kept out of the base install so that the
# toolkit still installs on a machine with none of them.
render = ["matplotlib", "trimesh"]
# What the tools under `evalkit/tools` need and the evaluator does not: the
# Wilcoxon test that `paired_stats` and `arms_paired` report beside the
# bootstrap (scipy) and the per-clip chart `compare_eval` draws on request
# (matplotlib). The tools import them only where they are used, so reading
# and checking scores works without the extra.
tools = ["scipy", "matplotlib"]
# The depth stages need the render extra, Depth Anything 3, Pi3X and torch. DA3
# pins numpy below 2, and no numpy below 2 supports a Python newer than 3.12,
# so this extra installs on Python 3.12 only. DA3 imports `addict` without
# declaring it, so the extra declares it. The Pi3X stage needs `pi3`, which
# declares only `safetensors`; it imports torch and `huggingface_hub`, so the
# extra declares them too. DA3 and `pi3` are named by their repositories for
# now. Each gets pinned to the commit the workbench's GPU machine ran, once
# that commit is read from the machine's install.
recon3d = [
    "omnisurg-4d-scene-graph[render]",
    "torch",
    "depth-anything-3 @ git+https://github.com/ByteDance-Seed/Depth-Anything-3.git",
    "addict",
    "pi3 @ git+https://github.com/yyfz/Pi3.git",
    "huggingface_hub",
]
# The tracking and per-frame segmentation stages need the `render` extra and
# SAM's automatic mask generator, which cuts frames into regions. The tracking
# stage also needs SAM 3's video tracker from transformers. torch,
# transformers and segment-anything are imported only when a stage builds its
# models, so the stages' tests run without them. The lower bound of
# transformers is the version the tracking stage was compared with the
# workbench on; how the session stores the presence logits may differ below it.
track = [
    "omnisurg-4d-scene-graph[render]",
    "torch",
    "transformers>=5.19",
    "segment-anything",
]

[project.urls]
Homepage = "https://github.com/TaiToTo/omnisurg-4d-scene-graph"

# The install provides five packages: the libraries `surgical_core` and
# `evalkit`, the stages in `pipeline`, and the models in `recon3d_wrapper` and
# `sam3_wrapper`.
# A stage runs as `python -m pipeline.<stage>`. The packages are installed
# rather than run from the clone. A stage then runs the same from any
# directory, and no script edits `sys.path` to find the other packages.
[tool.setuptools.packages.find]
include = ["surgical_core*", "evalkit*", "pipeline*", "recon3d_wrapper*", "sam3_wrapper*"]

# The class tables are data the evaluator reads and hashes, so an install
# without them would score nothing.
[tool.setuptools.package-data]
evalkit = ["class_tables/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
