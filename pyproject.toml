[build-system]
# 77 is the first release that accepts `license` below as an SPDX string; older
# ones reject this file outright, which an isolated build (always the latest
# setuptools) never shows.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisurg-4d-scene-graph"
version = "0.1.0"
description = "Training-free 4D scene graphs for minimally invasive surgery, and the toolkit they are measured with"
readme = "README.md"
# The lowest version CI runs. Declaring an older one would promise installs
# nothing checks.
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Yasuto Tamura" }]

# What the evaluator needs: it reads masks with Pillow, and takes regions and
# boundaries with numpy and OpenCV. Their versions are recorded with every
# score, so they are deliberately unpinned here: a reader should be able to
# install this next to whatever else they have, and pinning would make the
# package uninstallable long before the numbers stop being citable.
# opencv-python rather than opencv-python-headless, though nothing here opens a
# window: both install the same `cv2` package, so depending on the headless one
# would leave two builds writing over each other in an environment that already
# has opencv-python.
dependencies = ["numpy", "opencv-python", "Pillow"]

[project.optional-dependencies]
# What the pipeline's images and point clouds need and the evaluator does
# not: the depth colormaps (matplotlib), the Poisson integration in Retinex
# (scipy) and the GLB writer (trimesh), imported by
# `surgical_core.geometry.render`, `surgical_core.viewer.depth_vis` and
# `surgical_core.viewer.glb`. Kept out of the base install so that the
# toolkit still installs on a machine with none of them.
render = ["scipy", "matplotlib", "trimesh"]
# What the tools under `evalkit/tools` need and the evaluator does not: the
# Wilcoxon test that `paired_stats` reports beside the bootstrap (scipy) and
# the per-clip chart `compare_eval` draws on request (matplotlib). The tools
# import them only where they are used, so reading and checking scores works
# without the extra.
tools = ["scipy", "matplotlib"]

[project.urls]
Homepage = "https://github.com/TaiToTo/omnisurg-4d-scene-graph"

# `surgical_core` and `evalkit` are importable libraries; tools import the
# evaluator as `evalkit.<module>`. The other top-level directories hold
# scripts and model wrappers, which are run, not installed.
[tool.setuptools.packages.find]
include = ["surgical_core*", "evalkit*"]

# The class tables are data the evaluator reads and hashes, so an install
# without them would score nothing.
[tool.setuptools.package-data]
evalkit = ["class_tables/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
