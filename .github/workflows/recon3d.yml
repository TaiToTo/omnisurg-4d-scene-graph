name: recon3d

# Run the README's pipeline install on a clean runner. The job checks that
# the `recon3d` extra resolves, that the backends and their stages import,
# and that the suite passes with torch installed. It uses no GPU and no
# weights. It installs torch and the models' dependencies, several gigabytes,
# so it runs only when something it installs or tests changes.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - pyproject.toml
      - README.md
      - recon3d_wrapper/**
      - pipeline/**
      - surgical_core/**
      - tests/test_depth_stage.py
      - tests/test_recon3d_wrapper.py
      - tests/test_pi3x_backend.py
      - tests/test_pi3x_stage.py
      - .github/workflows/recon3d.yml

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    # The install takes about four minutes; a stuck download should not hold the runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The README asks for Python 3.12: DA3 pins numpy below 2.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0t64

      # Run the README's step, word for word.
      - run: pip install -e ".[recon3d]"

      # Import the backends, the upstream models and the stages. A package can
      # install and still fail to import; no weights are loaded here.
      - run: python -c "import recon3d_wrapper.da3, recon3d_wrapper.pi3x, depth_anything_3.api, pi3.models.pi3x, pipeline.depth, pipeline.pi3x, trimesh, matplotlib"

      - run: pip install pytest
      - run: pytest
