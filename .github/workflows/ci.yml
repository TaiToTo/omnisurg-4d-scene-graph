name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    # A named release, not ubuntu-latest: the apt package names below belong to
    # a release, and moving to the next one is a change to make on purpose, not
    # one to find in a red run.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every version requires-python allows, from the floor to the one the
        # project is developed on: a user runs whichever one they have.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # The whole history, not the default single commit: the personal-email
      # check reads every commit's author, committer and message, and refuses a
      # shallow clone rather than pass on the part it cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # opencv-python links against libGL and glib even when nothing is drawn.
      # The runner image happens to ship both today; installing them here keeps
      # the run from depending on that, and records what a bare machine needs.
      # FFmpeg converts the one ATLAS-120k video OpenCV cannot decode; its tests
      # skip without it, so it is installed here to make them run.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0t64 ffmpeg

      # No extras: the evaluation toolkit has to install and run without the
      # pipeline's dependencies.
      - run: pip install -e .

      # The dependencies have to import, not only install: cv2 is the one that
      # fails at import time when a system library is missing.
      - run: python -c "import cv2, numpy, PIL"

      # pytest adds nothing the package imports, so this is still the no-extras
      # install.
      - run: pip install pytest
      - run: pytest

  # `surgical_core.geometry.render`, the depth colormap and the GLB writer
  # need the `render` extra, the tools' statistics and chart need the
  # `tools` extra, and the StereoMIS reader needs the `stereomis` extra, so
  # the job above never imports them and their tests skip there. This job
  # installs the three extras and runs the same suite, so those tests run
  # somewhere.
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0t64 ffmpeg
      - run: pip install -e ".[render,tools,stereomis]" pytest
      - run: python -c "import surgical_core.geometry.render, surgical_core.stereomis, scipy.stats, matplotlib, trimesh"
      - run: pytest

  # The viewer is a web page with tests of its own, run by Node. The build is
  # run too, since a page whose imports do not resolve still passes its tests.
  viewer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
